# US915 region, sub-band 2 (channels 8-15 + 65).
# Mirrors the upstream chirpstack-docker region_us915_1.toml.

[[regions]]
  id = "us915_1"
  description = "US915 (channels 8-15 + 65)"
  common_name = "US915"

  [regions.gateway]
    force_gws_private = false

    [regions.gateway.backend]
      enabled = "mqtt"

      [regions.gateway.backend.mqtt]
        # Must match the gateway bridge topic templates (us915_1/...).
        topic_prefix = "us915_1"
        event_topic = "us915_1/gateway/+/event/+"
        state_topic = "us915_1/gateway/+/state/+"
        command_topic = "us915_1/gateway/{{ gateway_id }}/command/{{ command }}"
        server = "tcp://$MQTT_BROKER_HOST:1883/"
        username = ""
        password = ""
        qos = 0
        clean_session = false
        client_id = ""
        ca_cert = ""
        tls_cert = ""
        tls_key = ""

  [regions.network]
    installation_margin = 10
    rx_window = 0
    rx1_delay = 1
    rx1_dr_offset = 0
    rx2_dr = 8
    rx2_frequency = 923300000
    rx2_prefer_on_rx1_dr_lt = 0
    rx2_prefer_on_link_budget = false
    downlink_tx_power = -1
    adr_disabled = false
    min_dr = 0
    max_dr = 3

    # Sub-band 2: uplink channels 8-15 (125 kHz) + channel 65 (500 kHz).
    enabled_uplink_channels = [8, 9, 10, 11, 12, 13, 14, 15, 65]

    [regions.network.rejoin_request]
      enabled = false
      max_count_n = 15
      max_time_n = 15

    [regions.network.class_b]
      ping_slot_dr = 0
      ping_slot_frequency = 0
