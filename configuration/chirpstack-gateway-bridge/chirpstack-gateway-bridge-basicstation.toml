# Gateway bridge: Basic Station (WebSocket) -> MQTT.
# Gateways connect outbound to ws://<server>:3001 (add TLS before using
# this over the public internet for customer sites).

[general]
  log_level = 4

[backend]
  type = "basic_station"

  [backend.basic_station]
    bind = ":3001"
    region = "US915"
    frequency_min = 902000000
    frequency_max = 928000000

    # Leave empty for plain ws:// during the POC.
    ca_cert = ""
    tls_cert = ""
    tls_key = ""

    # Sub-band 2 (channels 8-15 + 65). Must match region_us915_1.toml.
    [[backend.basic_station.concentrators]]
      [backend.basic_station.concentrators.multi_sf]
        frequencies = [
          903900000,
          904100000,
          904300000,
          904500000,
          904700000,
          904900000,
          905100000,
          905300000,
        ]
      [backend.basic_station.concentrators.lora_std]
        frequency = 904600000
        bandwidth = 500000
        spreading_factor = 8

[integration]
  marshaler = "protobuf"

  [integration.mqtt]
    event_topic_template = "us915_1/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
    state_topic_template = "us915_1/gateway/{{ .GatewayID }}/state/{{ .StateType }}"
    command_topic_template = "us915_1/gateway/{{ .GatewayID }}/command/#"
    state_retained = true
    keep_alive = "30s"
    max_reconnect_interval = "1m0s"

    [integration.mqtt.auth]
      type = "generic"

      [integration.mqtt.auth.generic]
        servers = ["tcp://mosquitto:1883"]
        username = ""
        password = ""
        qos = 0
        clean_session = true
        client_id = ""
