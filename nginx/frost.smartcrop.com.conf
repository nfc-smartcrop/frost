# ChirpStack UI + API for SmartCrop Frost.
# Install: cp to /etc/nginx/sites-available/, symlink into sites-enabled, then
#   certbot --nginx -d frost.smartcrop.com
# (certbot rewrites this file to add the 443 block and redirect.)
server {
    listen 80;
    listen [::]:80;
    server_name frost.smartcrop.com;

    client_max_body_size 10m;

    # gRPC-web + UI
    location / {
        proxy_pass         http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    # Optional REST wrapper (chirpstack-rest-api) under /rest/
    location /rest/ {
        proxy_pass         http://127.0.0.1:8101/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
