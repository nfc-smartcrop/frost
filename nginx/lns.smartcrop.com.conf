# Basic Station LNS endpoint for LoRaWAN gateways (WebSocket over TLS).
# Gateways connect to wss://lns.smartcrop.com  — nginx terminates TLS and
# proxies plain WebSocket to the gateway bridge on 127.0.0.1:8103.
# Install: cp to /etc/nginx/sites-available/, symlink, then
#   certbot --nginx -d lns.smartcrop.com
# DNS: this hostname must be DNS-only (grey cloud) in Cloudflare — gateways
# need a direct TLS connection, not a proxied one.
server {
    listen 80;
    listen [::]:80;
    server_name lns.smartcrop.com;

    location / {
        proxy_pass         http://127.0.0.1:8103;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        # LoRa gateways hold the socket open for hours
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
